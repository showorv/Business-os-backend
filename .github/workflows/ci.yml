name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: business_os
          POSTGRES_PASSWORD: business_os
          POSTGRES_DB: business_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U business_os"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # GitHub service containers cannot pass a start command, which MinIO needs.
      - run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=business_os -e MINIO_ROOT_PASSWORD=business_os_dev cgr.dev/chainguard/minio:latest server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
